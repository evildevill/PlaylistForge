name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_artifacts:
        description: Build platform installers (AppImage, .deb, .exe, .dmg)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

permissions:
  contents: write
  actions: read

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy playlistforge

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q playlistforge tests
      - run: pytest -v --tb=short

  build-linux-appimage:
    name: Build Linux (AppImage)
    needs: [lint, test]
    if: github.event_name == 'push' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.build_artifacts)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Build PyInstaller bundle
        run: pyinstaller packaging/pyinstaller/playlistforge.linux.spec --clean --noconfirm
      - name: Install appimagetool
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse libfuse2 librsvg2-bin
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -O /tmp/appimagetool
          chmod +x /tmp/appimagetool
      - name: Prepare AppDir
        run: |
          mkdir -p build/appdir/usr/bin
          cp -r dist/PlaylistForge/* build/appdir/usr/bin/
          cp packaging/linux/playlistforge.desktop build/appdir/
          cp packaging/icons/playlistforge.svg build/appdir/
          rsvg-convert -w 128 -h 128 packaging/icons/playlistforge.svg -o build/appdir/playlistforge.png
          cat > build/appdir/AppRun << 'APPRUN'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          export PATH="${HERE}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/bin:${LD_LIBRARY_PATH}"
          cd "${HERE}/usr/bin"
          ./PlaylistForge "$@"
          APPRUN
          chmod +x build/appdir/AppRun
      - name: Build AppImage
        run: |
          ARCH=x86_64 /tmp/appimagetool build/appdir dist/PlaylistForge-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: PlaylistForge-Linux-AppImage
          path: dist/PlaylistForge-x86_64.AppImage

  build-linux-deb:
    name: Build Linux (.deb)
    needs: [lint, test]
    if: github.event_name == 'push' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.build_artifacts)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Build .deb package
        run: bash packaging/linux/build-dpkg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PlaylistForge-Linux-DEB
          path: dist/playlistforge_*.deb

  build-windows:
    name: Build Windows (Installer)
    needs: [lint, test]
    if: github.event_name == 'push' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.build_artifacts)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Build PyInstaller bundle
        run: pyinstaller packaging/pyinstaller/playlistforge.windows.spec --clean --noconfirm
      - name: Install Inno Setup
        run: choco install innosetup --no-progress --confirm
      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\playlistforge.iss
      - uses: actions/upload-artifact@v4
        with:
          name: PlaylistForge-Windows-Setup
          path: dist/PlaylistForge-Setup-*.exe

  build-macos:
    name: Build macOS (DMG)
    needs: [lint, test]
    if: github.event_name == 'push' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.build_artifacts)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Generate .icns icon
        run: bash packaging/macos/generate-icns.sh
      - name: Build PyInstaller .app
        run: pyinstaller packaging/pyinstaller/playlistforge.macos.spec --clean --noconfirm
      - name: Install create-dmg
        run: brew install create-dmg
      - name: Create DMG
        run: bash packaging/macos/build-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PlaylistForge-macOS-DMG
          path: dist/PlaylistForge-*.dmg

  release:
    name: Create GitHub Release
    needs:
      - build-linux-appimage
      - build-linux-deb
      - build-windows
      - build-macos
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: PlaylistForge-*
          merge-multiple: true
          path: release-artifacts
      - name: List release artifacts
        run: ls -lhR release-artifacts/
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUBI }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --generate-notes \
            release-artifacts/*.AppImage \
            release-artifacts/*.deb \
            release-artifacts/*.exe \
            release-artifacts/*.dmg
