[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "playlistforge"
version = "0.1.0"
description = "Extract, clean, transform, and export YouTube playlists."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "PlaylistForge Contributors" }]
keywords = ["youtube", "playlist", "desktop", "pyside6", "yt-dlp", "export"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
  "Topic :: Utilities",
]
dependencies = [
  "PySide6-Essentials>=6.7",
  "yt-dlp>=2024.8.6",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "pyinstaller>=6.8",
]

[project.gui-scripts]
playlistforge = "playlistforge.app:main"

[tool.hatch.build.targets.wheel]
packages = ["playlistforge"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN201"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[[tool.mypy.overrides]]
module = ["yt_dlp", "openpyxl"]
ignore_missing_imports = true
