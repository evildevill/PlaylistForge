<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>
  <g fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- play button -->
    <polygon points="52,42 82,60 52,78" fill="#fff" stroke="none"/>
    <!-- list lines -->
    <line x1="32" y1="50" x2="38" y2="50" stroke-width="3"/>
    <line x1="32" y1="56" x2="38" y2="56" stroke-width="3"/>
    <line x1="32" y1="78" x2="38" y2="78" stroke-width="3"/>
    <line x1="32" y1="84" x2="38" y2="84" stroke-width="3"/>
    <!-- gear/cog -->
    <circle cx="96" cy="96" r="10" stroke-width="3"/>
    <circle cx="96" cy="96" r="4" fill="#fff" stroke="none"/>
  </g>
</svg>
